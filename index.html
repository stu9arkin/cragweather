<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CragWeather — UK Climbing Crag Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="error-banner" class="error-banner" hidden></div>

  <div id="top-bar" class="top-bar">
    <div class="top-bar-controls">
      <label for="variable-toggle">Show:</label>
      <select id="variable-toggle">
        <option value="temperature">Temperature</option>
        <option value="rainfall">Rainfall</option>
      </select>
    </div>

    <div id="search-box" class="search-box">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search crags…"
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        aria-controls="search-results"
        aria-label="Search crags"
        autocomplete="off"
      />
      <ul id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
  </div>

  <div id="bottom-bar" class="bottom-bar">
    <div id="time-bar" class="time-bar">
      <div id="time-bar-floating-label" class="time-bar-floating-label" hidden></div>
      <input type="range" id="time-scrollbar" class="time-scrollbar" min="0" max="55" step="1" value="0" />
      <div id="time-bar-ticks" class="time-bar-ticks"></div>
    </div>
  </div>

  <div id="legend" class="legend"></div>

  <aside id="detail-panel" class="detail-panel" hidden>
    <button id="detail-panel-close" class="detail-panel-close" aria-label="Close">&times;</button>
    <div id="detail-panel-content"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
