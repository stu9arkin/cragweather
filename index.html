<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CragWeather — UK Climbing Crag Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="error-banner" class="error-banner" hidden></div>

  <div id="controls" class="controls">
    <div class="control-row">
      <label for="variable-toggle">Show:</label>
      <select id="variable-toggle">
        <option value="temperature">Temperature</option>
        <option value="rainfall">Rainfall</option>
      </select>
    </div>
    <div class="control-row">
      <span id="time-label" class="time-label"></span>
      <input type="range" id="time-scrollbar" min="0" max="55" step="1" value="0" />
    </div>
  </div>

  <div id="legend" class="legend"></div>

  <aside id="detail-panel" class="detail-panel" hidden>
    <button id="detail-panel-close" class="detail-panel-close" aria-label="Close">&times;</button>
    <div id="detail-panel-content"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
