<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CragWeather — UK Climbing Crag Weather Map</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧗</text></svg>">

  <meta property="og:title" content="CragWeather — UK Climbing Crag Weather Map">
  <meta property="og:description" content="An interactive map of every known UK outdoor climbing crag, coloured by forecast temperature or rainfall over the next 7 days, with per-crag detail and a UKC search link.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://stu9arkin.github.io/cragweather/">
  <meta property="og:image" content="https://stu9arkin.github.io/cragweather/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CragWeather — UK Climbing Crag Weather Map">
  <meta name="twitter:description" content="An interactive map of every known UK outdoor climbing crag, coloured by forecast temperature or rainfall over the next 7 days, with per-crag detail and a UKC search link.">
  <meta name="twitter:image" content="https://stu9arkin.github.io/cragweather/docs/screenshot.png">
  <script>
    (function () {
      var stored = localStorage.getItem('cragweather-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="error-banner" class="error-banner" hidden></div>

  <div id="top-bar" class="top-bar">
    <div class="top-bar-controls">
      <label for="variable-toggle">Show:</label>
      <select id="variable-toggle">
        <option value="temperature">Temperature</option>
        <option value="rainfall">Rainfall</option>
      </select>
    </div>

    <div id="search-box" class="search-box">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search crags…"
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        aria-controls="search-results"
        aria-label="Search crags"
        autocomplete="off"
      />
      <ul id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </div>

    <div class="top-bar-end">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode"></button>
    </div>
  </div>

  <div id="bottom-bar" class="bottom-bar">
    <div id="time-bar" class="time-bar">
      <div id="time-bar-floating-label" class="time-bar-floating-label" hidden></div>
      <input type="range" id="time-scrollbar" class="time-scrollbar" min="0" max="55" step="1" value="0" />
      <div id="time-bar-ticks" class="time-bar-ticks"></div>
    </div>
  </div>

  <div id="legend" class="legend"></div>

  <aside id="detail-panel" class="detail-panel" hidden>
    <button id="detail-panel-close" class="detail-panel-close" aria-label="Close">&times;</button>
    <div id="detail-panel-content"></div>
  </aside>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
