# .github/workflows/refresh-crags.yml
name: Refresh crag data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-crags
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Fetch latest crag data
        run: npm run fetch-crags

      - name: Commit updated crag data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crags.json
          git diff --cached --quiet || git commit -m "chore: refresh crag data"
          git push
