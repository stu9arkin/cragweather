# .github/workflows/deploy-site.yml
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Refresh crag data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Mapbox config
        run: |
          cat > js/config.js <<'EOF'
          // js/config.js
          // Generated at deploy time from the MAPBOX_ACCESS_TOKEN repo secret
          // (see .github/workflows/deploy-site.yml). Not committed -- see
          // README "Frontend" section for local setup.
          export const MAPBOX_ACCESS_TOKEN = '${{ secrets.MAPBOX_ACCESS_TOKEN }}';
          EOF

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
